name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag is the version
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Check and build the server jar
        working-directory: server
        run: ./gradlew --no-daemon check shadowJar
      - name: Checksum
        working-directory: server/build/libs
        run: sha256sum "zellera-server-$(cat ../../../VERSION)-all.jar" > "zellera-server-$(cat ../../../VERSION)-all.jar.sha256"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar="server/build/libs/zellera-server-$(cat VERSION)-all.jar"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes "Release $GITHUB_REF_NAME." "$jar" "$jar.sha256"
