# nginx in front of a game that runs with ZEL_PROXY=none. Replace game.example.org, the certificate paths and, when
# you changed them, the two ports (ZEL_WS_PORT, ZEL_WEB_PORT).

map $http_upgrade $connection_upgrade {
	default upgrade;
	''      close;
}

server {
	listen 80;
	listen [::]:80;
	server_name game.example.org;
	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name game.example.org;

	ssl_certificate     /etc/letsencrypt/live/game.example.org/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/game.example.org/privkey.pem;

	add_header Strict-Transport-Security "max-age=31536000" always;
	add_header X-Content-Type-Options nosniff always;
	add_header Referrer-Policy strict-origin-when-cross-origin always;

	# $remote_addr, never $proxy_add_x_forwarded_for: the game takes this header's word for the player's address.
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-For $remote_addr;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_http_version 1.1;

	location /websocket {
		proxy_pass http://127.0.0.1:2076;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_read_timeout 1h;
		proxy_send_timeout 1h;
	}

	location / {
		proxy_pass http://127.0.0.1:8760;
		client_max_body_size 16m;
	}
}
