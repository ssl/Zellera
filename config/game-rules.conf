# Game rules, read at start by the server and the web. A missing or unknown key or a bad value stops the start.

# Reward tracks
reward_track.introduction.enabled=true
reward_track.halloween.enabled=false
# Every player holds the premium lane; false: premium tasks don't count and premium prizes need the pass.
reward_track.premium_for_everyone=true
# The premium pass sold while the lane is not everyone's: price (0 and 0 sells nothing), point boost, instant points.
reward_track.premium_pass.credits=100
reward_track.premium_pass.premium_price=100
reward_track.premium_pass.boost_percent=20
reward_track.premium_pass.instant_points=0

# Daily
daily_tasks.enabled=true
# Free daily gift in the earnings center.
daily_gift.enabled=true
# Respects per day, to players and to pets.
respect.daily_players=3
respect.daily_pets=3
respect.replenish_cost_points=50

# New accounts
new_player.credits=555
new_player.points=555
new_player.premium=555
new_player.look=hr-165-1404.hd-185-1391.ch-255-1338.lg-281-106.sh-305-92

# Build Pass
# Every new account gets a membership of membership_days.
build_pass.membership_for_everyone=true
build_pass.membership_days=3650
build_pass.member_furni_limit=1000
# Extra furni per bought 31-day offer.
build_pass.month_furni_bonus=250
build_pass.non_member_furni_limit=50
# Top limit shown to a non-member.
build_pass.non_member_max_furni_limit=2000000
# A non-member can't place while a visitor is in the room.
build_pass.non_member_alone_only=true
# A room with Build Pass furni of a non-member owner is locked.
build_pass.room_lock=true
# A placement that would lock a room asks first.
build_pass.placement_warning=true

# Floor plan editor
# Who may save a plan: permission, build_pass_member or owner.
floor_plan.editor=permission
floor_plan.requires_floor=true
floor_plan.max_area=4096
floor_plan.max_open_tiles=3025

# Snowball
snowball.enabled=true
# unlimited, none (joining is refused) or daily (daily games, then bought tokens).
snowball.free_games=unlimited
snowball.daily_free_games=3
snowball.daily_free_games_club=30
# Token offers sold with free_games=daily; 0 credits and 0 premium leaves one out.
snowball.tokens_10.credits=5
snowball.tokens_10.premium=5
snowball.tokens_100.credits=40
snowball.tokens_100.premium=40
snowball.tokens_300.credits=90
snowball.tokens_300.premium=90

# Idle (seconds)
# Players fall asleep after sleep_seconds in rooms without their own time.
idle.auto_sleep=true
idle.sleep_seconds=300
idle.room_sleep_min_seconds=30
idle.room_sleep_max_seconds=3600
idle.kick_enabled=true
# Kick time of a new room; 0 is off.
idle.new_room_kick_seconds=900
idle.room_kick_min_seconds=60
idle.room_kick_max_seconds=36000

# Rooms and chat
room.max_furni=4000
room.max_notes=200
room.max_pets=10
room.max_bots=10
# Spectators of a full room; 0 closes the spectator queue.
room.spectator_slots=10
# Visitors at which an owner of a room in the personal space category is asked to pick one; 0 never asks.
room.enforce_category_visitors=20
room.max_filter_words=110
chat.flood_mute_seconds=30
word_filter.replacement=*****

# Rollers
# Room ticks (500 ms) between roller passes, minus one, without a speed controller.
rollers.default_speed=3
# Height difference a roller may roll onto, in hundredths of a tile.
rollers.height_tolerance_hundredths=50

# Messenger
# Offline messages delivered at login; the rest wait for the next one.
messenger.offline_messages_max=500

# Pets
# Energy regained per minute: maximum energy divided by this.
pets.needs.rest_energy_divisor=64
# Seconds that add one thirst (0-100); a drink takes 75 off.
pets.needs.thirst_seconds=36
# Seconds of walking that cost one happiness; lying down brings it back.
pets.needs.walking_sadness_seconds=30
pets.mood.every_seconds=15
pets.mood.gesture_seconds=5
# Below its maximum energy divided by this a pet looks for food or rest.
pets.mood.weary_energy_divisor=4
# Thirst (0-100) from which a pet goes to drink on its own.
pets.mood.thirsty_from=80
# Happiness thresholds (0-100).
pets.mood.happy_from_happiness=90
pets.mood.sad_up_to_happiness=5
# Percent chance to follow a command: rested, and drained (below maximum energy divided by the divisor).
pets.obedience.rested_percent=75
pets.obedience.drained_percent=12
pets.obedience.drained_energy_divisor=8
# Below this happiness a pet follows no command.
pets.obedience.sulks_below_happiness=10
# Seconds a pet hears no command after one; the same command more than repeats_allowed times running inside the
# window is not heard either, and one in grumble_one_in of those gets a line.
pets.obedience.gap_seconds=2
pets.obedience.repeat_window_seconds=10
pets.obedience.repeats_allowed=3
pets.obedience.grumble_one_in=3
# Seconds a pet told to stay keeps its place; a nap in the nest lasts as long at least.
pets.obedience.stay_seconds=120
# Rarity both parent plants need for a rare seed.
pets.plants.rare_parent_from=8
# Percent of two-owner plant breedings that give a single seed.
pets.plants.one_seed_percent=50
# A baby's rarity tier is drawn on a bell around the parents' average level: spread at level 0 and narrowing per level,
# in hundredths.
pets.breeding.spread_hundredths=1000
pets.breeding.narrowing_hundredths=25
# Highest level of each rarity tier, commonest first.
pets.breeding.tier_1_up_to_level=10
pets.breeding.tier_2_up_to_level=15
pets.breeding.tier_3_up_to_level=18
pets.breeding.tier_4_up_to_level=20

# Catalog
# Furni per order, counting every unit of every pack.
catalog.max_items_per_order=100

# Player limits, without and with club
player.max_rooms=50
player.max_rooms_club=75
player.max_friends=500
player.max_friends_club=3000
player.max_favourite_rooms=30

# Login
# Take a player straight into their home room when they enter the game
login.enter_home_room=false
# The room a player without a home room enters then, by room number; 0 for none. Needs login.enter_home_room.
login.default_room=0

# A player name, for registering and for changing it in the game: its length (at most 32) and the characters
# allowed besides the letters a-z, A-Z and the digits
player.name.min_length=1
player.name.max_length=15
player.name.punctuation=-=?!@:.,µª

# Economy and social
# Hosting points = minutes others spent in a player's rooms x their level / this.
account_level.hosting_divisor=1000
# Days a resolution furni gives to reach its achievement level.
achievements.resolution_days=7
trading.enabled=true
# Credit furni received in a trade: wallet (turned into credits) or inventory.
trading.credit_furni=wallet
# Furni one trade offer message may add.
trading.batch_cap=100
marketplace.enabled=true
# Each offer spends a marketplace token.
marketplace.tokens_required=false
marketplace.token_batch_price=10
marketplace.token_batch_size=5
recycler.enabled=true
groups.require_club=true
groups.max_members=50000
groups.max_memberships=50
groups.max_memberships_club=200
club.payday_enabled=true
club.monthly_gift_notice=true

# Opening hours (HH:MM, game time zone); outside them logins are refused and players are sent out.
opening_hours.enabled=false
opening_hours.opens_at=07:00
opening_hours.closes_at=01:00

# Seasonal currency
seasonal_currency.enabled=false
# Comma-separated types; 101 is the event currency, 104 the letters.
seasonal_currency.types=101

# Message rates: milliseconds between two accepted messages of one kind; sooner ones are dropped.
rates.build_pass_place_gap_millis=125
rates.furni_move_gap_millis=200
rates.share_sync_gap_millis=1000
rates.wired_give_furni_gap_millis=200

# Safety limits against runaway rooms and connections; normal play never meets them.
limits.wired_nesting=40
limits.wired_steps_per_firing=121
limits.wired_signals_per_firing=250
limits.wired_signal_hops=200
limits.wired_signal_forwarded=100
limits.wired_call_tiles=30
limits.wired_call_stacks=30
# Largest client frame in bytes; a larger one closes the connection.
limits.frame_bytes=417792
limits.messages_per_kind_per_second=10
limits.messages_per_second=50
limits.moderation_chatlog_lines=150
limits.moderation_room_visits=50
# Waiting reports per player; one more asks to withdraw them.
limits.reports_open_per_player=10
